name: CI

on:
  push:
    branches: [main, next, beta]
  pull_request:
    branches: [main, next, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · lint · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (code nouveau)
        run: npm run lint

      - name: Tests
        run: npm test

  build:
    name: Build CDN
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build web component
        run: npm run build:cdn
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Vérifier les artefacts
        run: |
          test -f dist-cdn/sqljob.js
          test -f dist-cdn/sqljob.css
          ls -lh dist-cdn | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: dist-cdn
          path: dist-cdn
          retention-days: 7
