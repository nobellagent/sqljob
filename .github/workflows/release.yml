name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      - name: Build web component
        run: npm run build:cdn
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Empreintes d'intégrité (SRI)
        run: node tools/sri.mjs dist-cdn

      - name: Vérifier le paquet
        run: npm pack --dry-run

      # Publication npm volontairement inactive : le paquet s'appelle
      # @ihatexcel/sqljob, un scope qui n'appartient pas à ce fork, et il n'est
      # pas publié sur le registre. L'étape reste inerte tant que le secret
      # NPM_TOKEN n'existe pas. La release GitHub (bundle zip) suffit.
      - name: Publier sur npm (inactif — aucun NPM_TOKEN)
        if: startsWith(github.ref, 'refs/tags/v') && env.NODE_AUTH_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Archiver le bundle CDN
        run: |
          cd dist-cdn && zip -qr ../dist-cdn.zip . && cd ..
          ls -lh dist-cdn.zip

      - name: Attacher les artefacts à la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-cdn.zip
          generate_release_notes: true
